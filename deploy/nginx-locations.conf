# Include these locations inside the existing documentation server block.
# Documentation continues to use its current root and location /.
location = /landing {
    return 301 /landing/;
}

location ^~ /landing/ {
    alias /var/www/school-framework-landing/;
    try_files $uri $uri/ /landing/index.html;
}

location = /api/common {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /api/page {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# The CMS listens on loopback only. Use an SSH tunnel for /admin until HTTPS exists.
location = /admin { return 403; }
location ^~ /admin/ { return 403; }
